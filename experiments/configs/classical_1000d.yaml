name: classical_1000d
experiment_type: classical
description: >
  1000D shifted classical benchmark. Matches paper Tables 3/5/7
  and Figure 8. Long-running; CMA-ES is expensive at 1000D.

dim: 1000
runs: 20
pop_size: 30
max_iters: 500
seed: 42

algorithms:
  - HPPSO
  - Original PSO
  - PSO-m
  - PSO-RIW
  - SHADE
  - GWO
  - Sep-CMA-ES
  - GA-MPC
  - CSA

output:
  save_csv: true
  save_json: true
